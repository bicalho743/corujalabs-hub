name: Fetch Windsor Metrics

on:
  schedule:
    # 06:00 BRT = 09:00 UTC (BRT = UTC-3)
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r metrics/requirements.txt

      - name: Fetch metrics (Tamara - 30 dias)
        env:
          WINDSOR_API_KEY: ${{ secrets.WINDSOR_API_KEY }}
        run: python metrics/fetch_metrics.py --persona tamara --days 30

      - name: Commit updated JSON if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nenhuma mudanca nas metricas."
          else
            git commit -m "chore: update metrics data [skip ci]"
            git push
          fi
